# ENS Hold'em backend — Cloudflare Workers + Durable Objects + D1.
#
# Setup:
#   npx wrangler d1 create epoker            # then paste database_id below
#   npx wrangler d1 execute epoker --file=schema.sql --remote
#   npx wrangler deploy

name = "epoker-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Each poker table is one Durable Object instance — Cloudflare scales
# horizontally by placing each table near its players; a single table's
# state is strongly consistent because the DO is single-threaded.
[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]

# Leaderboard, bankrolls and the table registry live in D1 (SQLite).
[[d1_databases]]
binding = "DB"
database_name = "epoker"
database_id = "0acc384c-4925-4b2c-abcd-727c9201f40e"

# SESSION_SECRET is a secret, NOT a var — `npx wrangler secret put SESSION_SECRET`.
# Never add it here: a [vars] entry shadows the secret of the same name.
[vars]
# Frontends allowed by CORS, the SIWE domain check and socket upgrades.
ALLOWED_ORIGINS = "https://epoker.eth.limo,https://epoker.eth.link,https://hoodpoker.eth.limo,https://hoodpoker.eth.link,http://localhost:3000"
# Transitional: accept the old static signature from the frontend pinned
# before SIWE. Closed 2026-09-17 once epoker.eth pointed at the SIWE pin
# QmRPMCFViRwMtpgjjK6jdGoSSAp2HM8AM8hTC4d1kM3D73 — SIWE is now the only way in.
ALLOW_LEGACY_SIG = "0"
MAINNET_RPC = "https://ethereum-rpc.publicnode.com"

# Rate limits (per key, per period in seconds — Cloudflare allows 10 or 60).
# namespace_id is any account-unique integer.
[[ratelimits]]
name = "AUTH_LIMITER"      # nonce + verify, per IP
namespace_id = "46631"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "CREATE_LIMITER"    # table creation, per address
namespace_id = "46632"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SOCKET_LIMITER"    # WebSocket upgrades, per IP
namespace_id = "46633"
simple = { limit = 40, period = 60 }
